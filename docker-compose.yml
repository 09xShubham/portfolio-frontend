services:
  frontend:
    build:
      context: ./portfolio
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - tgflow_default
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

  backend:
    build:
      context: ./portfolio-backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    networks:
      - tgflow_default

networks:
  tgflow_default:
    external: true

